name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux only: macOS runners cost ten times the minutes on a private repo,
    # so the iOS targets are not built here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the library
        run: ./gradlew :koord:assemble

      - name: Build the Android sample
        working-directory: samples
        run: ./gradlew :androidApp:assembleDebug
