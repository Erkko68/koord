name: Pages

on:
  # A push to main deploys. Pull requests only build the docs, and only when the
  # build itself changes: Dokka does not fail on KDoc, so source changes cannot break it.
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build-logic/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    # macOS: Dokka documents the iOS source set too, which needs Xcode.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the API docs
        run: ./gradlew :dokkaGenerate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
